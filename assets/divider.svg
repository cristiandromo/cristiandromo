<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" preserveAspectRatio="none" width="100%" height="8" role="img" aria-label="divisor animado">
  <defs>
    <linearGradient id="d-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F7FF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <linearGradient id="d-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="8" rx="4" fill="url(#d-base)"/>
  <rect x="-260" y="0" width="260" height="8" rx="4" fill="url(#d-shine)">
    <animate attributeName="x" from="-260" to="1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
