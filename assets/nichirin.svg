<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140" role="img" aria-label="Espada Nichirin con respiracion solar">
  <defs>
    <linearGradient id="n-fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3D00"/>
      <stop offset="0.5" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FFF45C"/>
    </linearGradient>
    <linearGradient id="n-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3s" repeatCount="indefinite"/>

    <!-- estelas de corte -->
    <path d="M120 8 Q320 67 120 126" fill="none" stroke="url(#n-fire)" stroke-width="5" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="420" to="-420" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M150 22 Q330 67 150 112" fill="none" stroke="#FFCB05" stroke-width="3" stroke-linecap="round" stroke-dasharray="380" stroke-dashoffset="380" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="380" to="-380" dur="2.3s" repeatCount="indefinite"/>
    </path>

    <!-- empunadura -->
    <rect x="20" y="58" width="70" height="18" rx="4" fill="#2A1F1A" stroke="#4A3428" stroke-width="2"/>
    <g fill="#EE1515">
      <polygon points="30,59 36,67 30,75 24,67"/>
      <polygon points="44,59 50,67 44,75 38,67"/>
      <polygon points="58,59 64,67 58,75 52,67"/>
      <polygon points="72,59 78,67 72,75 66,67"/>
      <polygon points="86,59 92,67 86,75 80,67"/>
    </g>

    <!-- tsuba -->
    <ellipse cx="97" cy="67" rx="7" ry="18" fill="#1A1A1A" stroke="#FFCB05" stroke-width="2"/>

    <!-- hoja -->
    <polygon points="103,59 372,57 400,67 372,77 103,75" fill="url(#n-blade)" stroke="#3A3A3A" stroke-width="1"/>
    <line x1="103" y1="59" x2="400" y2="67" stroke="#FF3D00" stroke-width="6" opacity="0.35"/>
    <line x1="103" y1="60" x2="398" y2="67.5" stroke="#FFF45C" stroke-width="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <!-- lenguas de fuego sobre el filo -->
    <g fill="url(#n-fire)">
      <g transform="translate(160 60)">
        <path d="M0 0 C7 -14 7 -26 0 -38 C-7 -26 -7 -14 0 0 Z">
          <animate attributeName="opacity" values="0.5;1;0.6;1;0.5" dur="1.3s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(230 62)">
        <path d="M0 0 C9 -16 9 -30 0 -44 C-9 -30 -9 -16 0 0 Z">
          <animate attributeName="opacity" values="0.6;1;0.5;1;0.6" dur="1.7s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(305 64)">
        <path d="M0 0 C8 -15 8 -28 0 -40 C-8 -28 -8 -15 0 0 Z">
          <animate attributeName="opacity" values="0.55;1;0.65;1;0.55" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(360 66)">
        <path d="M0 0 C6 -12 6 -22 0 -32 C-6 -22 -6 -12 0 0 Z">
          <animate attributeName="opacity" values="0.5;1;0.6;1;0.5" dur="1.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
