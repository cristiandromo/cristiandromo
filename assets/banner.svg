  <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">Backend · Cloud · Data Base Administrator</text>

  <g stroke="#FFCB05" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    <line x1="380" y1="194" x2="470" y2="194"/>
    <line x1="730" y1="194" x2="820" y2="194"/>
