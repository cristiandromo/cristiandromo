    <path d="M-120 238 L-120 224 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 q30 -12 60 -3 q30 -10 60 -1 L1320 238 Z" fill="url(#b-flame)" opacity="0.55"/>
  </g>
  <g opacity="0.9">
