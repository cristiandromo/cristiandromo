    <path d="M-120 238 L-120 230 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 q30 -9 60 -2 q30 -8 60 -1 L1320 238 Z" fill="url(#b-flame)"/>
