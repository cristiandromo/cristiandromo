<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Marco de avatar animado">
  <defs>
    <linearGradient id="av-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D00"/>
      <stop offset="0.5" stop-color="#FFCB05"/>
      <stop offset="1" stop-color="#FFF45C"/>
    </linearGradient>
    <radialGradient id="av-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFCB05" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#FF6A00" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#av-glow)">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="120" cy="120" r="104" fill="none" stroke="#21262D" stroke-width="2"/>

  <!-- arco giratorio principal -->
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#av-ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="170 483">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- arco secundario girando al reves -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#FF8A00" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 488" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- brasas orbitando -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="7s" repeatCount="indefinite"/>
    <circle cx="120" cy="16" r="4" fill="#FFF45C"/>
    <circle cx="224" cy="120" r="3" fill="#FFCB05"/>
    <circle cx="120" cy="224" r="4" fill="#FF8A00"/>
    <circle cx="16" cy="120" r="3" fill="#FFCB05"/>
  </g>

  <!-- silueta central -->
  <circle cx="120" cy="102" r="30" fill="#30363D"/>
  <path d="M68 178 Q68 140 120 140 Q172 140 172 178 Z" fill="#30363D"/>
</svg>
